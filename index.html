<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="cart-container">

        <h1>My Cart</h1>

        <!-- Product 1 -->
        <div class="product">
            <div>
                <h2>T-Shirt</h2>
                <p>Price: ₹500</p>
            </div>

            <div class="quantity">
                <button>-</button>
                <span>2</span>
                <button>+</button>
            </div>

            <p class="item-total">₹1000</p>

            <button class="remove">Remove</button>
        </div>

        <!-- Product 2 -->
        <div class="product">
            <div>
                <h2>Shoes</h2>
                <p>Price: ₹1200</p>
            </div>

            <div class="quantity">
                <button>-</button>
                <span>1</span>
                <button>+</button>
            </div>

            <p class="item-total">₹1200</p>

            <button class="remove">Remove</button>
        </div>

        <!-- Cart Summary -->
        <div class="summary">
            <h2>Cart Summary</h2>

            <p>Total Quantity: <strong>3</strong></p>

            <p>Total Price: <strong>₹2200</strong></p>

            <a href="checkout-page.html" ><button class="checkout">Checkout</button></a>
        </div>

    </div>

</body>
</html>
